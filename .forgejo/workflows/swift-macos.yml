name: Swift (macOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift-macos:
    name: Swift (macOS)
    # Self-hosted runner (Claw): Codeberg provides no hosted Actions runners.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: swift build && swift test
