name: Style and namespacing

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  style:
    name: Style and namespacing
    # Self-hosted runner (Claw): Codeberg provides no hosted Actions runners.
    runs-on: quick
    steps:
      - uses: actions/checkout@v4
      - name: Style gate
        run: bash scripts/check-style.sh
      - name: Namespacing gate
        run: bash scripts/check-namespacing.sh
      - name: Install tools
        run: brew install swiftformat swiftlint
      - name: SwiftFormat lint
        run: swiftformat --lint . --config .swiftformat
      - name: SwiftLint
        run: swiftlint --config .swiftlint.yml --strict
